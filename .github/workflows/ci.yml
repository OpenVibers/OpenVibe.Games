name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # install, node --check, tests, contract and pin-drift checks: the shared test job (WS-Q task 1).
  test:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/test.yml@66b76f868ea8228aad7811309eafef3726b036f3
    with:
      package-manager: pnpm # version from package.json "packageManager"
      install: pnpm install --frozen-lockfile
      test: pnpm typecheck && pnpm lint && pnpm test
      syntax-dirs: '' # TypeScript: typecheck covers it
      # One command per line. The client build is what the budget check reads:
      # without it dist/ is absent and bundleBudget.ts fails (by design).
      extra: |
        (cd apps/server && npx openvibe-contracts-check --service games --src src)
        pnpm --filter @openvibe/client build
        # Initial JS and the 400 KB chunk limit are both enforced: Babylon's core is a chain of layers since
        # scripts/vendorLayers.ts (it was one 2.09 MB chunk), and Rapier is a wasm file since #61.
        node --import tsx apps/client/scripts/bundleBudget.ts
  # The editor's browser acceptance suites (ADR-0007 M6: editor E2E in CI). The real server and the built client in
  # Chromium: pnpm test:editor (one editor, every tool, live saves reaching the server) and pnpm test:collab (two
  # editors on one map). They ran only by hand before, and 15 checks had quietly gone red; this keeps them green.
  editor-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @openvibe/client build
      - run: pnpm test:editor
      - run: pnpm test:collab
  # Secret scan (gitleaks) and dependency audit, shared by every OpenVibers repo.
  security:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/security.yml@66b76f868ea8228aad7811309eafef3726b036f3
