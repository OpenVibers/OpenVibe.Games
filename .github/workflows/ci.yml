name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1   # production runs Node 22 (better-sqlite3 is native: build it for this ABI)
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
