# OpenVibe.Games nginx vhosts: apex (portal + /play + /editor) and
# play.openvibe.games (game at /). Both proxy the SAME process on :8000 —
# routing is done in-process from the Host header, so proxy_set_header Host
# is load-bearing here.
# Install: cp deploy/nginx-openvibe-games.conf /etc/nginx/sites-available/openvibe.games
#          ln -s ../sites-available/openvibe.games /etc/nginx/sites-enabled/
# Certs: certbot certonly -d openvibe.games -d play.openvibe.games

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.games www.openvibe.games play.openvibe.games;
    return 301 https://$host$request_uri;
}

# www → apex (the wildcard certificate covers www).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.openvibe.games;
    ssl_certificate     /etc/letsencrypt/live/openvibe.games/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.games/privkey.pem;
    return 301 https://openvibe.games$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openvibe.games;
    include snippets/security-txt.conf;

    ssl_certificate     /etc/letsencrypt/live/openvibe.games/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.games/privkey.pem;

    client_max_body_size 64m; # map saves + editor asset uploads (48 MB cap in-app)

    # Terms, Privacy and DMCA: static pages built by OpenVibe.Sites (openvibe-shared/legal).
    location = /tos { return 301 /terms; }

    # Readiness is for callers on the host (curl 127.0.0.1:8000/api/ready), not the internet.
    location = /api/ready { return 404; }

    # ── The Events webhook: OpenVibe.Events delivers over loopback, never through the public vhosts ──
    location /internal/ { return 404; }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:8000/metrics) ──
    location = /metrics { return 404; }

    # The game server sends no security headers of its own (2026-10-17: none at all on openvibe.games). No CSP or
    # frame rule here: games and worlds are embedded elsewhere and load from several origins.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Game + editor WebSockets (/ws, /editor-ws).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Long-lived sockets: don't cut a quiet session.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.openvibe.games;
    include snippets/security-txt.conf;

    ssl_certificate     /etc/letsencrypt/live/openvibe.games/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.games/privkey.pem;

    client_max_body_size 64m;

    # Readiness is for callers on the host (curl 127.0.0.1:8000/api/ready), not the internet.
    location = /api/ready { return 404; }

    # ── The Events webhook: OpenVibe.Events delivers over loopback, never through the public vhosts ──
    location /internal/ { return 404; }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:8000/metrics) ──
    location = /metrics { return 404; }

    # The game server sends no security headers of its own (2026-10-17: none at all on openvibe.games). No CSP or
    # frame rule here: games and worlds are embedded elsewhere and load from several origins.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }
}
