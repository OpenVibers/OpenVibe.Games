<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Scraplandia — OpenVibe.Games</title>
    <meta
      name="description"
      content="Play Scraplandia: scrappy multiplayer survival-building in and around Scrap City, in your browser, no download. Part of the OpenVibe network."
    />
    <!-- The OpenVibe Frame: the user's theme before first paint, then navbar + footer. -->
    <script src="/shared/theme-loader.js"></script>
    <script src="/shared/navbar.js" defer></script>
    <script src="/shared/footer.js" defer></script>
    <link rel="canonical" href="https://play.openvibe.games/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenVibe.Games" />
    <meta property="og:title" content="Scraplandia — play in your browser" />
    <meta
      property="og:description"
      content="Scrappy multiplayer survival-building in and around Scrap City. Physgun anything, weld it to anything else, haul your salvage home. No download."
    />
    <meta property="og:url" content="https://play.openvibe.games/" />
    <meta property="og:image" content="https://openvibe.games/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scraplandia — play in your browser" />
    <meta
      name="twitter:description"
      content="Multiplayer survival-building on the OpenVibe network. In your browser, no download."
    />
    <meta name="twitter:image" content="https://openvibe.games/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "@id": "https://play.openvibe.games/#game",
        "name": "Scraplandia",
        "url": "https://play.openvibe.games/",
        "image": "https://openvibe.games/og-image.png",
        "description": "Scrappy multiplayer survival-building in and around Scrap City: physgun anything, weld it to anything else, chase supply drops in the wilds and haul your salvage home.",
        "genre": ["Survival", "Sandbox", "Building"],
        "playMode": "MultiPlayer",
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "isPartOf": {
          "@type": "WebSite",
          "name": "OpenVibe.Games",
          "url": "https://openvibe.games/"
        },
        "publisher": {
          "@type": "Organization",
          "name": "OpenVibe",
          "url": "https://openvibe.network/"
        }
      }
    </script>
    <link rel="stylesheet" href="/src/ui/styles.css" />
    <script>
      window.__ovgFrame = { page: 'play', title: 'Scraplandia', collapsible: true }
      // The iframe route (/surf/embed) is the canvas and HUD only: an
      // embedding site owns the page around it.
      if (new URLSearchParams(location.search).get('embed') === '1')
        document.documentElement.classList.add('ov-embed')
    </script>
    <style>
      .ov-embed #navbar-mount, .ov-embed #ov-footer, .ov-embed .ovf, .ov-embed .ov-nav { display: none !important; }
      .ov-embed, .ov-embed body, .ov-embed #stage { margin: 0; height: 100%; overflow: hidden; background: #070b12; }
    </style>
    <script src="/frame.js" defer></script>
  </head>
  <body>
    <!--
      The shared navbar mounts at the top; the game fills the stage below it.
      Once the player is in the world (the `ovg:playing` event) the Frame
      folds away and a small floating button brings it back — see frame.js.
    -->
    <div id="navbar-mount"></div>
    <noscript>
      <!-- What the page is, for a visitor without JavaScript and for crawlers: the games themselves need it. -->
      <main style="max-width: 46rem; margin: 2rem auto; padding: 0 1rem; color: #e6edf7; font: 16px/1.6 system-ui, sans-serif">
        <h1>Scraplandia and Salvage Rush</h1>
        <p>
          <strong>Scraplandia</strong> is scrappy multiplayer survival-building in and around Scrap City: physgun
          anything, weld it to anything else, cook at a burn barrel, chase supply drops in the wilds and haul your
          salvage home before another scrapper takes it. Every valuable you extract scores haul points on the week's
          board.
        </p>
        <p>
          <strong>Salvage Rush</strong> is its quick cousin: collect scrap around a compact arena in timed
          on-foot rounds, scored by the server, with a public leaderboard.
        </p>
        <p>
          Both run in your browser with no download, as a guest or with your OpenVibe account. They need JavaScript and
          WebGL: turn JavaScript on to play.
        </p>
        <p>
          <a href="https://openvibe.games/" style="color: #8ab4ff">All games</a> ·
          <a href="https://openvibe.games/leaderboard.html" style="color: #8ab4ff">Leaderboards</a>
        </p>
      </main>
    </noscript>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="ui"></div>
    </div>
    <footer id="ov-footer" class="ovf"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
